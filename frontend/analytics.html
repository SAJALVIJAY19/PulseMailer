<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseMailer — Analytics Dashboard</title>
  <meta name="description" content="Monitor your AI email campaign performance, token usage, and cache efficiency.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Space Grotesk', 'sans-serif'] } } } }
  </script>
  <style>
    *, .glass, .btn-glass, [class*="rounded"] { border-radius: 0 !important; }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Space Grotesk', 'sans-serif'; background: #020817; color: #e2e8f0; margin: 0; overflow-x: hidden; }

    .orb { position: fixed; border-radius: 9999px; filter: blur(120px); z-index: -1; pointer-events: none; }
    .orb-cyan { width: 500px; height: 500px; background: rgba(34,211,238,0.15); top: -120px; left: -120px; }
    .orb-blue { width: 480px; height: 480px; background: rgba(37,99,235,0.15); bottom: -100px; right: -100px; }
    .orb-indigo { width: 400px; height: 400px; background: rgba(99,102,241,0.08); top: 40%; left: 45%; }

    .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-radius: 0; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .grad-text { background: linear-gradient(135deg, #22d3ee, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px; background: rgba(2,8,23,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
    .nav-brand { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-link { color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
    .nav-link:hover { color: #fff; }
    .nav-link.active { color: #22d3ee; border-bottom: 2px solid #22d3ee; padding-bottom: 2px; }

    .btn-glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 0; padding: 8px 14px; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Space Grotesk', 'sans-serif'; display: inline-flex; align-items: center; gap: 6px; }
    .btn-glass:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }

    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .slide-up { animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards; opacity: 0; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .bar-track { width: 100%; height: 8px; background: rgba(255,255,255,0.06); border-radius: 0; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 0; width: 0; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

    .stat-accent { height: 2px; border-radius: 0; background: linear-gradient(135deg, #22d3ee, #2563eb); margin-top: auto; }
  </style>
</head>
<body>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-blue"></div>
  <div class="orb orb-indigo"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="landing.html" class="nav-brand grad-text" style="text-decoration: none;">PulseMailer</a>
    <div class="nav-links">
      <a href="landing.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="index.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Generate
      </a>
      <a href="dashboard.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        History
      </a>
      <a href="analytics.html" class="nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Analytics
      </a>
    </div>
  </nav>

  <main style="padding-top:100px; max-width:960px; margin:0 auto; padding-left:24px; padding-right:24px; padding-bottom:100px;">
    <!-- Header -->
    <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 style="font-size:36px; font-weight:700; color:#fff; margin:0 0 6px; letter-spacing:-1px;">Analytics</h1>
        <p style="color:#94a3b8; font-size:14px; margin:0;">Monitor your campaign performance and AI usage</p>
      </div>
      <button class="btn-glass" onclick="loadStats()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Refresh
      </button>
    </div>

    <!-- Stats Grid -->
    <div id="stats-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:24px;">
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
    </div>

    <!-- Breakdowns -->
    <div id="breakdowns" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
      <div class="skeleton" style="height:280px;"></div>
      <div class="skeleton" style="height:280px;"></div>
    </div>

    <!-- Cache Performance -->
    <div id="cache-section">
      <div class="skeleton" style="height:220px;"></div>
    </div>
  </main>

  <script>
    const API = window.location.origin;

    function formatNum(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    }

    // Count-up animation
    function animateCount(el, target, suffix = '') {
      const dur = 1500;
      const start = performance.now();
      const isFloat = String(target).includes('.');
      function tick(now) {
        const t = Math.min((now - start) / dur, 1);
        const ease = 1 - Math.pow(1 - t, 3); // ease-out cubic
        const val = Math.round(ease * target * 100) / 100;
        el.textContent = isFloat ? val.toFixed(1) + suffix : Math.round(val).toLocaleString() + suffix;
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = (isFloat ? target.toFixed(1) : target.toLocaleString()) + suffix;
      }
      requestAnimationFrame(tick);
    }

    function buildBreakdown(title, subtitle, breakdown, total, colors) {
      if (!Object.keys(breakdown).length) {
        return `<p style="color:#64748b; font-size:13px; text-align:center; padding:24px 0;">No data yet</p>`;
      }
      let rows = '';
      const entries = Object.entries(breakdown);
      entries.forEach(([key, count], i) => {
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        const color = colors[key] || { bar: 'linear-gradient(135deg, #22d3ee, #2563eb)' };
        rows += `
          <div style="margin-bottom:${i < entries.length - 1 ? '16px' : '0'};">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
              <span style="color:#fff; font-size:14px; font-weight:500;">${key.charAt(0).toUpperCase() + key.slice(1)}</span>
              <span style="color:#94a3b8; font-size:13px;">${count} · ${pct}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="background:${color.bar};" data-width="${pct}%" data-delay="${i * 0.15}"></div>
            </div>
          </div>`;
      });
      return rows;
    }

    const toneColors = {
      professional: { bar: 'linear-gradient(135deg, #3b82f6, #60a5fa)' },
      casual: { bar: 'linear-gradient(135deg, #22c55e, #4ade80)' },
      urgent: { bar: 'linear-gradient(135deg, #ef4444, #f87171)' },
      friendly: { bar: 'linear-gradient(135deg, #eab308, #facc15)' },
    };
    const goalColors = {
      awareness: { bar: 'linear-gradient(135deg, #22d3ee, #2563eb)' },
      conversion: { bar: 'linear-gradient(135deg, #22d3ee, #2563eb)' },
      retention: { bar: 'linear-gradient(135deg, #22d3ee, #2563eb)' },
      're-engagement': { bar: 'linear-gradient(135deg, #22d3ee, #2563eb)' },
    };

    async function loadStats() {
      document.getElementById('stats-grid').innerHTML = `
        <div class="skeleton" style="height:160px;"></div><div class="skeleton" style="height:160px;"></div>
        <div class="skeleton" style="height:160px;"></div><div class="skeleton" style="height:160px;"></div>`;
      document.getElementById('breakdowns').innerHTML = `
        <div class="skeleton" style="height:280px;"></div><div class="skeleton" style="height:280px;"></div>`;
      document.getElementById('cache-section').innerHTML = `<div class="skeleton" style="height:220px;"></div>`;

      try {
        const res = await fetch(`${API}/stats/`);
        if (!res.ok) throw new Error('Failed to fetch stats');
        const s = await res.json();

        // Stat Cards
        const statCards = [
          {
            icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.5"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>`,
            iconBg: 'rgba(34,211,238,0.12)', value: s.total_campaigns, label: 'Total Campaigns', suffix: ''
          },
          {
            icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>`,
            iconBg: 'rgba(59,130,246,0.12)', value: s.total_emails_generated, label: 'Emails Generated', suffix: ''
          },
          {
            icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>`,
            iconBg: 'rgba(129,140,248,0.12)', value: s.total_tokens_used, label: 'Tokens Used', suffix: ''
          },
          {
            icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
            iconBg: 'rgba(52,211,153,0.12)', value: s.cache_hit_rate, label: 'Cache Hit Rate', suffix: '%'
          },
        ];

        let cardsHtml = '';
        statCards.forEach((c, i) => {
          cardsHtml += `
            <div class="glass slide-up" style="padding:24px; display:flex; flex-direction:column; animation-delay:${i * 0.08}s;">
              <div style="width:48px; height:48px; border-radius:0; background:${c.iconBg}; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
                ${c.icon}
              </div>
              <p class="stat-value" data-target="${c.value}" data-suffix="${c.suffix}" style="color:#fff; font-size:40px; font-weight:800; margin:0; letter-spacing:-1px; line-height:1;">0${c.suffix}</p>
              <p style="color:#94a3b8; font-size:14px; margin:4px 0 16px;">${c.label}</p>
              <div class="stat-accent"></div>
            </div>`;
        });
        document.getElementById('stats-grid').innerHTML = cardsHtml;

        // Animate counts
        setTimeout(() => {
          document.querySelectorAll('.stat-value').forEach(el => {
            animateCount(el, parseFloat(el.dataset.target), el.dataset.suffix);
          });
        }, 300);

        // Breakdowns
        const totalC = s.total_campaigns || 0;
        document.getElementById('breakdowns').innerHTML = `
          <div class="glass slide-up" style="padding:28px; animation-delay:0.35s;">
            <h3 style="color:#fff; font-size:16px; font-weight:600; margin:0 0 4px;">Tone Breakdown</h3>
            <p style="color:#94a3b8; font-size:13px; margin:0 0 20px;">Distribution by email tone</p>
            ${buildBreakdown('Tone', '', s.tone_breakdown, totalC, toneColors)}
          </div>
          <div class="glass slide-up" style="padding:28px; animation-delay:0.42s;">
            <h3 style="color:#fff; font-size:16px; font-weight:600; margin:0 0 4px;">Goal Breakdown</h3>
            <p style="color:#94a3b8; font-size:13px; margin:0 0 20px;">Distribution by campaign goal</p>
            ${buildBreakdown('Goal', '', s.goal_breakdown, totalC, goalColors)}
          </div>`;

        // Cache Performance
        const cached = s.cached_campaigns || 0;
        const direct = s.total_campaigns - cached;
        const cachePct = s.total_campaigns > 0 ? Math.round((cached / s.total_campaigns) * 100) : 0;

        document.getElementById('cache-section').innerHTML = `
          <div class="glass slide-up" style="padding:28px; animation-delay:0.5s;">
            <h3 style="color:#fff; font-size:18px; font-weight:600; margin:0 0 28px;">Cache Performance</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:28px;">
              <div style="text-align:center;">
                <p class="stat-value" data-target="${cached}" data-suffix="" style="color:#22d3ee; font-size:48px; font-weight:800; margin:0; letter-spacing:-1px;">0</p>
                <p style="color:#94a3b8; font-size:14px; margin:4px 0 0;">Campaigns from Cache</p>
                <p style="color:#34d399; font-size:13px; margin:4px 0 0;">Saved ${cached} API calls</p>
              </div>
              <div style="text-align:center;">
                <p class="stat-value" data-target="${direct}" data-suffix="" style="color:#cbd5e1; font-size:48px; font-weight:800; margin:0; letter-spacing:-1px;">0</p>
                <p style="color:#94a3b8; font-size:14px; margin:4px 0 0;">Direct API Calls</p>
                <p style="color:#64748b; font-size:13px; margin:4px 0 0;">Groq LLM invocations</p>
              </div>
            </div>
            <div class="bar-track" style="height:12px; margin-bottom:12px;">
              <div class="bar-fill" style="background:linear-gradient(135deg, #22d3ee, #2563eb); height:100%;" data-width="${cachePct}%" data-delay="0.3"></div>
            </div>
            <p style="color:#94a3b8; font-size:14px; text-align:center; margin:0;">
              <span style="color:#22d3ee; font-weight:600;">${cachePct}%</span> served from cache
            </p>
          </div>`;

        // Animate bars + cache counts
        setTimeout(() => {
          document.querySelectorAll('.bar-fill[data-width]').forEach(bar => {
            const delay = parseFloat(bar.dataset.delay || 0) * 1000;
            setTimeout(() => { bar.style.width = bar.dataset.width; }, delay);
          });
          // Re-animate cache section counts
          document.querySelectorAll('#cache-section .stat-value').forEach(el => {
            animateCount(el, parseFloat(el.dataset.target), el.dataset.suffix);
          });
        }, 400);

      } catch (err) {
        const errHtml = `
          <div class="glass" style="padding:40px; text-align:center; grid-column:1/-1;">
            <p style="color:#f87171; font-weight:500; margin:0 0 4px;">Failed to load analytics</p>
            <p style="color:#64748b; font-size:13px; margin:0;">${err.message}</p>
          </div>`;
        document.getElementById('stats-grid').innerHTML = errHtml;
        document.getElementById('breakdowns').innerHTML = '';
        document.getElementById('cache-section').innerHTML = '';
      }
    }

    loadStats();
  </script>
</body>
</html>
