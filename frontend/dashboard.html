<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseMailer — Campaign History</title>
  <meta name="description" content="View all your past AI-generated email campaigns with PulseMailer.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #020817; color: #e2e8f0; margin: 0; overflow-x: hidden; }

    .orb { position: fixed; border-radius: 9999px; filter: blur(120px); z-index: -1; pointer-events: none; }
    .orb-cyan { width: 500px; height: 500px; background: rgba(34,211,238,0.15); top: -120px; left: -120px; }
    .orb-blue { width: 480px; height: 480px; background: rgba(37,99,235,0.15); bottom: -100px; right: -100px; }
    .orb-indigo { width: 400px; height: 400px; background: rgba(99,102,241,0.08); top: 40%; left: 45%; }

    .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .grad-text { background: linear-gradient(135deg, #22d3ee, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px; background: rgba(2,8,23,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
    .nav-brand { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-link { color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
    .nav-link:hover { color: #fff; }
    .nav-link.active { color: #22d3ee; border-bottom: 2px solid #22d3ee; padding-bottom: 2px; }

    .badge { background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.2); color: #22d3ee; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }

    .btn-glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 14px; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 6px; }
    .btn-glass:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .btn-glass.copied { border-color: rgba(34,197,94,0.3); color: #22c55e; }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Expand */
    .expand-body { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease, padding 0.3s ease; padding: 0 24px; }
    .expand-body.open { max-height: 3000px; opacity: 1; padding: 0 24px 24px; }

    .slide-up { animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1) forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .chevron-icon { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .chevron-icon.open { transform: rotate(180deg); }

    /* Tone badges */
    .tone-professional { background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.2); color: #60a5fa; }
    .tone-casual { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2); color: #4ade80; }
    .tone-urgent { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: #f87171; }
    .tone-friendly { background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.2); color: #facc15; }
  </style>
</head>
<body>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-blue"></div>
  <div class="orb orb-indigo"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="landing.html" class="nav-brand grad-text" style="text-decoration: none;">PulseMailer</a>
    <div class="nav-links">
      <a href="landing.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="index.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Generate
      </a>
      <a href="dashboard.html" class="nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        History
      </a>
      <a href="analytics.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Analytics
      </a>
    </div>
  </nav>

  <main style="padding-top:100px; max-width:860px; margin:0 auto; padding-left:24px; padding-right:24px; padding-bottom:100px;">
    <!-- Header -->
    <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 style="font-size:36px; font-weight:700; color:#fff; margin:0 0 6px; letter-spacing:-1px;">Campaign History</h1>
        <p style="color:#94a3b8; font-size:14px; margin:0;">All your AI-generated campaigns</p>
      </div>
      <button class="btn-glass" onclick="loadHistory()" id="refresh-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Refresh
      </button>
    </div>

    <!-- Container -->
    <div id="history-container"></div>
  </main>

  <script>
    const API = 'http://127.0.0.1:8000';

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function formatDate(iso) {
      const d = new Date(iso);
      const day = d.getDate();
      const month = d.toLocaleString('en-US', { month: 'short' });
      const year = d.getFullYear();
      const time = d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      return `${day} ${month} ${year} · ${time}`;
    }

    function toggleExpand(idx) {
      const body = document.getElementById(`expand-${idx}`);
      const chevron = document.getElementById(`chevron-${idx}`);
      body.classList.toggle('open');
      chevron.classList.toggle('open');
    }

    function copyToClipboard(text, btnEl) {
      navigator.clipboard.writeText(text).then(() => {
        btnEl.classList.add('copied');
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied`;
        setTimeout(() => { btnEl.innerHTML = orig; btnEl.classList.remove('copied'); }, 2000);
      });
    }

    function showSkeleton() {
      return `<div style="display:flex; flex-direction:column; gap:12px;">
        <div class="skeleton" style="height:88px;"></div>
        <div class="skeleton" style="height:88px;"></div>
        <div class="skeleton" style="height:88px;"></div>
      </div>`;
    }

    async function loadHistory() {
      const container = document.getElementById('history-container');
      container.innerHTML = showSkeleton();

      try {
        const res = await fetch(`${API}/history/?skip=0&limit=50`);
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();

        if (!data.length) {
          container.innerHTML = `
            <div class="glass" style="padding:60px 32px; text-align:center;">
              <div style="width:56px; height:56px; margin:0 auto 16px; border-radius:14px; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              </div>
              <p style="color:#fff; font-size:20px; font-weight:600; margin:0 0 6px;">No campaigns yet</p>
              <p style="color:#94a3b8; font-size:14px; margin:0 0 24px;">Generate your first campaign to see it here</p>
              <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#22d3ee,#2563eb); color:#fff; font-size:14px; font-weight:600; padding:12px 24px; border-radius:10px; text-decoration:none; box-shadow:0 0 24px rgba(34,211,238,0.2); transition:all 0.2s;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                Create Campaign
              </a>
            </div>`;
          return;
        }

        let html = '';
        data.forEach((c, idx) => {
          const toneClass = `tone-${c.tone}`;
          const cachedHtml = c.cached
            ? `<span class="badge" style="font-size:11px; padding:2px 8px;">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                Cached
              </span>` : '';

          let emailsHtml = '';
          if (c.emails && c.emails.length) {
            c.emails.forEach((em, ei) => {
              const jsBody = em.body.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/`/g,'\\`').replace(/\n/g,'\\n').replace(/\r/g,'');
              const jsSub = em.subject_line.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/`/g,'\\`').replace(/\n/g,'\\n').replace(/\r/g,'');
              const jsCta = em.cta_text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/`/g,'\\`').replace(/\n/g,'\\n').replace(/\r/g,'');
              emailsHtml += `
                <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:16px; margin-bottom:10px;">
                  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                    <span style="font-size:12px; font-weight:600; color:#22d3ee;">Email ${ei + 1}</span>
                    <button class="btn-glass" style="padding:4px 10px; font-size:11px;" onclick="copyToClipboard('${jsSub}\\n\\n${jsBody}\\n\\n${jsCta}', this)">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                      Copy
                    </button>
                  </div>
                  <p style="color:#fff; font-weight:500; font-size:14px; margin:0 0 8px; line-height:1.4;">${esc(em.subject_line)}</p>
                  <p style="color:#94a3b8; font-size:13px; line-height:1.6; margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer;" onclick="this.style.display='block'; this.style.webkitLineClamp='unset';">${esc(em.body)}</p>
                  <span class="badge" style="font-size:11px; padding:2px 8px;">${esc(em.cta_text)}</span>
                </div>`;
            });
          }

          html += `
            <div class="glass slide-up" style="margin-bottom:12px; overflow:hidden; animation-delay:${idx * 0.05}s;">
              <div style="padding:20px 24px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:background 0.2s;" onclick="toggleExpand(${idx})" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background='transparent'">
                <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                  <div style="width:40px; height:40px; border-radius:10px; background:rgba(34,211,238,0.08); border:1px solid rgba(34,211,238,0.15); display:flex; align-items:center; justify-content:center; color:#22d3ee; font-size:16px; font-weight:700; flex-shrink:0;">
                    ${c.product_name.charAt(0).toUpperCase()}
                  </div>
                  <div style="min-width:0;">
                    <p style="color:#fff; font-weight:600; font-size:16px; margin:0;">${esc(c.product_name)}</p>
                    <p style="color:#64748b; font-size:13px; margin:2px 0 0;">${formatDate(c.created_at)}</p>
                  </div>
                  <span class="badge ${toneClass}" style="font-size:11px; padding:2px 8px; border-radius:6px;">${c.tone.charAt(0).toUpperCase() + c.tone.slice(1)}</span>
                  <span class="badge" style="font-size:11px; padding:2px 8px;">${c.goal.charAt(0).toUpperCase() + c.goal.slice(1)}</span>
                  ${cachedHtml}
                </div>
                <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
                  <span style="color:#64748b; font-size:13px;">${c.email_count} email${c.email_count !== 1 ? 's' : ''}</span>
                  <svg id="chevron-${idx}" class="chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
              </div>
              <div id="expand-${idx}" class="expand-body">
                <div style="border-top:1px solid rgba(255,255,255,0.06); padding-top:16px;">
                  ${emailsHtml}
                </div>
              </div>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `
          <div class="glass" style="padding:40px; text-align:center;">
            <p style="color:#f87171; font-weight:500; margin:0 0 4px;">Failed to load history</p>
            <p style="color:#64748b; font-size:13px; margin:0;">${err.message}</p>
          </div>`;
      }
    }

    loadHistory();
  </script>
</body>
</html>
